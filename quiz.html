<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DMRC • QUIZ EXAMINATION</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #06131d;
    color: white;
    min-height: 100vh;
}

.exam-container {
    width: 100%;
    max-width: 700px;
    margin: auto;
    padding: 35px 20px;
}

.exam-header {
    text-align: center;
    padding: 25px 10px 35px;
}

.exam-header h1 {
    font-size: 30px;
    font-weight: 800;

    background: linear-gradient(
        90deg,
        #38bdf8,
        #67e8f9,
        #a5f3fc,
        #38bdf8
    );

    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;

    margin-bottom: 10px;
}

.exam-header p {
    color: #9cc5d8;
    font-size: 14px;
}

.exam-card {
    border: 1px solid #243746;
    border-radius: 20px;
    background: #111f2e;
    padding: 30px 20px;
    text-align: center;
}

.exam-label {
    color: #668398;
    font-size: 12px;
    font-weight: bold;
    margin-bottom: 15px;
}

.subject {
    font-size: 25px;
    line-height: 1.4;
    margin-bottom: 30px;
}

.info {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
    margin-bottom: 30px;
}

.info-box {
    background: #0d1b28;
    border: 1px solid #243746;
    border-radius: 14px;
    padding: 18px 10px;
}

.info-box span {
    display: block;
    color: #718798;
    font-size: 12px;
    margin-bottom: 8px;
}

.info-box strong {
    color: #67e8f9;
    font-size: 16px;
}

.count-title {
    color: #9cc5d8;
    font-size: 14px;
    margin-bottom: 15px;
}

.countdown {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
}

.time-box {
    background: #0d1b28;
    border: 1px solid #243746;
    border-radius: 12px;
    padding: 15px 5px;
}

.time-box strong {
    display: block;
    color: #63c8ee;
    font-size: 25px;
}

.time-box span {
    color: #718798;
    font-size: 10px;
}

.status {
    margin-top: 25px;
    color: #718798;
    font-size: 13px;
}

.start-btn {
    display: none;
    margin: 25px auto 0;
    padding: 13px 28px;
    border-radius: 30px;
    border: 1px solid #14516d;
    background: #0d2b3a;
    color: #67e8f9;
    text-decoration: none;
    font-weight: bold;
}

.start-btn:hover {
    background: #123e52;
}

.back {
    display: block;
    text-align: center;
    margin-top: 25px;
    color: #718798;
    text-decoration: none;
    font-size: 13px;
}

@media (max-width: 600px) {

    .exam-header h1 {
        font-size: 24px;
    }

    .subject {
        font-size: 21px;
    }

    .info {
        grid-template-columns: 1fr;
    }

    .countdown {
        grid-template-columns: repeat(2, 1fr);
    }
}
</style>
</head>

<body>

<div class="exam-container">

    <div class="exam-header">
        <h1>DMRC QUIZ EXAMINATION</h1>
        <p>Class 12 • Quiz Examination 2026</p>
    </div>

    <div class="exam-card">

        <div class="exam-label">QUIZ EXAM</div>

        <h2 class="subject" id="subject">
            Loading...
        </h2>

        <div class="info">

            <div class="info-box">
                <span>পরীক্ষার তারিখ</span>
                <strong id="date"></strong>
            </div>

            <div class="info-box">
                <span>পরীক্ষার সময়</span>
                <strong id="examTime"></strong>
            </div>

        </div>

        <div class="count-title">
            পরীক্ষা শুরু হতে বাকি
        </div>

        <div class="countdown">

            <div class="time-box">
                <strong id="days">00</strong>
                <span>দিন</span>
            </div>

            <div class="time-box">
                <strong id="hours">00</strong>
                <span>ঘণ্টা</span>
            </div>

            <div class="time-box">
                <strong id="minutes">00</strong>
                <span>মিনিট</span>
            </div>

            <div class="time-box">
                <strong id="seconds">00</strong>
                <span>সেকেন্ড</span>
            </div>

        </div>

        <div class="status" id="status">
            পরীক্ষা শুরু হওয়ার অপেক্ষায়...
        </div>

        <a href="#" class="start-btn" id="startBtn">
            পরীক্ষা শুরু করুন →
        </a>

    </div>

    <a href="index.html" class="back">
        ← Quiz Routine-এ ফিরে যান
    </a>

</div>


<script>

const exams = {

    1: {
        name: "পদার্থবিজ্ঞান ২য় পত্র",
        date: "০৫ সেপ্টেম্বর ২০২৬",
        time: "১০:০০ - ১২:০০",
        start: "2026-09-05T10:00:00+06:00"
    },

    2: {
        name: "উচ্চতর গণিত ২য় পত্র",
        date: "০৫ সেপ্টেম্বর ২০২৬",
        time: "১০:০০ - ১২:০০",
        start: "2026-09-05T10:00:00+06:00"
    },

    3: {
        name: "বাংলা ২য় পত্র",
        date: "১২ সেপ্টেম্বর ২০২৬",
        time: "১০:০০ - ১২:০০",
        start: "2026-09-12T10:00:00+06:00"
    },

    4: {
        name: "তথ্য ও যোগাযোগ প্রযুক্তি",
        date: "১২ সেপ্টেম্বর ২০২৬",
        time: "১০:০০ - ১২:০০",
        start: "2026-09-12T10:00:00+06:00"
    },

    5: {
        name: "ইংরেজি ২য় পত্র",
        date: "১৯ সেপ্টেম্বর ২০২৬",
        time: "১০:০০ - ১২:০০",
        start: "2026-09-19T10:00:00+06:00"
    },

    6: {
        name: "রসায়ন ২য় পত্র",
        date: "২৬ সেপ্টেম্বর ২০২৬",
        time: "১০:০০ - ১২:০০",
        start: "2026-09-26T10:00:00+06:00"
    },

    7: {
        name: "জীববিজ্ঞান ২য় পত্র",
        date: "২৬ সেপ্টেম্বর ২০২৬",
        time: "১০:০০ - ১২:০০",
        start: "2026-09-26T10:00:00+06:00"
    }

};


// URL থেকে quiz number নেওয়া
const params = new URLSearchParams(window.location.search);

const quizId = params.get("quiz");

const exam = exams[quizId];


if (!exam) {

    document.getElementById("subject").innerText =
        "Quiz পাওয়া যায়নি";

} else {

    document.getElementById("subject").innerText =
        exam.name;

    document.getElementById("date").innerText =
        exam.date;

    document.getElementById("examTime").innerText =
        exam.time;


    const startTime = new Date(exam.start).getTime();


    function updateCountdown() {

        const now = new Date().getTime();

        const distance = startTime - now;


        if (distance <= 0) {

            document.getElementById("days").innerText = "00";
            document.getElementById("hours").innerText = "00";
            document.getElementById("minutes").innerText = "00";
            document.getElementById("seconds").innerText = "00";

            document.getElementById("status").innerText =
                "পরীক্ষা এখন শুরু হয়েছে!";

            document.getElementById("startBtn").style.display =
                "inline-block";

            return;
        }


        const days =
            Math.floor(distance / (1000 * 60 * 60 * 24));

        const hours =
            Math.floor(
                (distance % (1000 * 60 * 60 * 24))
                / (1000 * 60 * 60)
            );

        const minutes =
            Math.floor(
                (distance % (1000 * 60 * 60))
                / (1000 * 60)
            );

        const seconds =
            Math.floor(
                (distance % (1000 * 60))
                / 1000
            );


        document.getElementById("days").innerText =
            String(days).padStart(2, "0");

        document.getElementById("hours").innerText =
            String(hours).padStart(2, "0");

        document.getElementById("minutes").innerText =
            String(minutes).padStart(2, "0");

        document.getElementById("seconds").innerText =
            String(seconds).padStart(2, "0");
    }


    updateCountdown();

    setInterval(updateCountdown, 1000);

}

</script>

</body>
</html>
